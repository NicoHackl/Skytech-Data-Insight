configuration:
  log_level:
    name: Log level
    description: How verbose the add-on logs are.
  grafana_admin_password:
    name: Grafana admin password
    description: >-
      Password of the Grafana user "admin" for LAN login (port 3000). Leave empty
      if Grafana is only used through the Home Assistant sidebar – LAN login is
      then locked.
  db_password:
    name: Database password (full access)
    description: >-
      Password of the database user "skytech_admin" for LAN access (port 5432,
      e.g. VSCode). May read, write and change the schema. Empty = login locked.
  db_readonly_password:
    name: Database password (read only)
    description: >-
      Password of the database user "skytech_reader" for read-only LAN access.
      Empty = login locked.
  mcp_token:
    name: MCP token
    description: >-
      Access key for the MCP server (port 8765) that lets an LLM such as Claude
      or ChatGPT work with the database, sensors and Grafana dashboards. At least
      16 random characters. Empty = MCP server off.
network:
  3000/tcp: Grafana in the LAN
  5432/tcp: PostgreSQL in the LAN (VSCode)
  8765/tcp: MCP server for LLMs
