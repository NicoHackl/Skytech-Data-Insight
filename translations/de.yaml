configuration:
  log_level:
    name: Protokollstufe
    description: Wie ausführlich das Add-on ins Protokoll schreibt.
  grafana_admin_password:
    name: Grafana-Admin-Passwort
    description: >-
      Passwort des Grafana-Benutzers „admin" für die Anmeldung im LAN (Port 3000).
      Leer lassen, wenn Grafana nur über das HA-Seitenmenü genutzt wird – dann ist
      die LAN-Anmeldung gesperrt.
  grafana_tls:
    name: Grafana per https (Port 3000)
    description: >-
      Liefert Port 3000 verschlüsselt mit dem Zertifikat aus dem HA-Ordner „ssl“ aus.
      Nötig, um Grafana in einer HA-Karte „Website“ einzubinden, wenn HA über https
      läuft. Die Adresse muss die Domain des Zertifikats enthalten, nicht die IP.
      Fehlen die Dateien, bleibt Port 3000 unverschlüsselt.
  grafana_tls_certfile:
    name: Zertifikatsdatei für Grafana
    description: Name der Zertifikatsdatei (Kette) im HA-Ordner „ssl“, z. B. fullchain.pem.
  grafana_tls_keyfile:
    name: Schlüsseldatei für Grafana
    description: Name der privaten Schlüsseldatei im HA-Ordner „ssl“, z. B. privkey.pem.
  db_password:
    name: Datenbank-Passwort (Vollzugriff)
    description: >-
      Passwort des Datenbankbenutzers „skytech_admin" für den Zugang aus dem LAN
      (Port 5432, z. B. VSCode). Darf lesen, schreiben und das Schema ändern.
      Leer = Anmeldung gesperrt.
  db_readonly_password:
    name: Datenbank-Passwort (nur lesen)
    description: >-
      Passwort des Datenbankbenutzers „skytech_reader" für lesenden Zugang aus
      dem LAN. Leer = Anmeldung gesperrt.
  mcp_token:
    name: MCP-Token
    description: >-
      Zugangsschlüssel für den MCP-Server (Port 8765), über den ein LLM wie Claude
      oder ChatGPT Datenbank, Sensoren und Grafana-Dashboards bearbeiten kann.
      Mindestens 16 Zeichen, zufällig wählen. Leer = MCP-Server aus.
network:
  3000/tcp: Grafana im LAN
  5432/tcp: PostgreSQL im LAN (VSCode)
  8765/tcp: MCP-Server für LLMs
