# Von init-postgres bei jedem Start geschrieben – Änderungen hier gehen verloren.
# TYPE  DATABASE  USER                           ADDRESS    METHOD
# Lokale Sockets. Welcher Betriebssystem-Benutzer welche Rolle nutzen darf,
# regelt pg_ident.conf.
local   all       postgres                                  peer map=skytech
local   skytech   skytech_app,skytech_collector,skytech_admin  peer map=skytech
# Netz (LAN über Port 5432, lokal für Grafana): nur die beiden Anmelderollen,
# nur die Datenbank skytech, nur mit Passwort.
host    skytech   skytech_admin,skytech_reader   0.0.0.0/0  scram-sha-256
host    skytech   skytech_admin,skytech_reader   ::/0       scram-sha-256
# SkytechHEMS (Vertrag contract_hems_data_insight): nur aus dem Add-on-Bereich des
# Supervisor-Netzes. Bewusst nicht 172.30.32.0/23: Verbindungen über den
# freigegebenen LAN-Port kommen mit der Adresse des Docker-Gateways 172.30.32.1 an.
host    skytech   skytech_hems                   172.30.33.0/24  scram-sha-256
# Grafana im Container, nur lokal.
host    skytech   skytech_grafana                127.0.0.1/32  scram-sha-256
host    skytech   skytech_grafana                ::1/128       scram-sha-256
