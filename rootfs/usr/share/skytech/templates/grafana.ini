; Von init-grafana bei jedem Start geschrieben – Änderungen hier gehen verloren.
; Quelle: rootfs/usr/share/skytech/templates/grafana.ini
; Keine Secrets in dieser Datei: das Admin-Passwort setzt init-grafana über die CLI.

[paths]
data = /data/grafana
plugins = /data/grafana/plugins
logs = /data/grafana/log
provisioning = /etc/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3001
; Grafana läuft unter dem Ingress-Pfad des Add-ons (D-006). nginx reicht
; Anfragen aus Ingress und LAN mit genau diesem Präfix weiter.
root_url = http://localhost__INGRESS_ENTRY__/grafana/
serve_from_sub_path = true
enforce_domain = false

[security]
admin_user = admin
; Home Assistant zeigt das Ingress-Panel in einem iframe.
allow_embedding = true
cookie_samesite = lax
disable_gravatar = true

[auth]
disable_login_form = false

[auth.proxy]
; Über Ingress meldet nginx den HA-Benutzer per Header an. Nur Anfragen von
; nginx (127.0.0.1) dürfen den Header setzen; der LAN-Server entfernt ihn.
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
whitelist = 127.0.0.1, ::1

[users]
allow_sign_up = false
allow_org_create = false
; Das Ingress-Panel sehen nur HA-Administratoren (panel_admin).
auto_assign_org_role = Admin
default_theme = system
default_language = de-DE

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[log]
mode = console
level = __GRAFANA_LOG_LEVEL__

[date_formats]
default_timezone = Europe/Berlin
full_date = DD.MM.YYYY HH:mm:ss
interval_second = HH:mm:ss
interval_minute = HH:mm
interval_hour = DD.MM. HH:mm
interval_day = DD.MM.
interval_month = MM.YYYY
interval_year = YYYY
