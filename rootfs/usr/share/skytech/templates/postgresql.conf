# Von init-postgres bei jedem Start geschrieben – Änderungen hier gehen verloren.
# Quelle: rootfs/usr/share/skytech/templates/postgresql.conf

# M0: nur innerhalb des Containers erreichbar. Der LAN-Zugang (VSCode) folgt mit M1.
listen_addresses = 'localhost'
port = 5432
unix_socket_directories = '/run/postgresql'
hba_file = '__RUN_DIR__/pg_hba.conf'
ident_file = '__RUN_DIR__/pg_ident.conf'

shared_preload_libraries = 'timescaledb'
# Keine Nutzungsdaten an Timescale senden.
timescaledb.telemetry_level = off

# Gespeichert wird in UTC (timestamptz); die Anzeige in Berliner Zeit ist Sache
# von Grafana, Views und Oberfläche.
timezone = 'UTC'
log_timezone = 'UTC'

log_destination = 'stderr'
logging_collector = off
log_line_prefix = '[postgres] '
