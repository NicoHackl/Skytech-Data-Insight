# Von init-nginx bei jedem Start geschrieben – Änderungen hier gehen verloren.
# Quelle: rootfs/usr/share/skytech/templates/nginx.conf
#
# Zwei Eingänge (D-006):
#  - 8099 Ingress: der Supervisor entfernt das Präfix __INGRESS_ENTRY__.
#    „/" geht an die Verwaltungsoberfläche, „/grafana/" an Grafana, das unter
#    dem vollen Präfix läuft und deshalb das Präfix zurückbekommt.
#  - 3000 LAN: Grafana mit eigener Anmeldung. Der Pfad enthält das Präfix,
#    weil Grafana alle Verweise mit seiner root_url erzeugt.

worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;
daemon off;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    # Uploads von Sicherungen kommen mit M2 und können groß sein.
    client_max_body_size 0;
    # Weiterleitungen relativ lassen – der Host hinter Ingress ist Home Assistant.
    absolute_redirect off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Der Supervisor meldet den angemeldeten HA-Benutzer. Fehlt der Header
    # (ältere Supervisor-Versionen), wird ein fester Benutzer angemeldet – der
    # Ingress selbst ist bereits durch den HA-Login geschützt.
    map $http_x_remote_user_name $grafana_user {
        default $http_x_remote_user_name;
        ''      homeassistant;
    }

    upstream skytech_app {
        server 127.0.0.1:8100;
    }

    upstream skytech_grafana {
        server 127.0.0.1:3001;
    }

    server {
        listen 8099 default_server;
        __INGRESS_ACCESS__

        location = /grafana {
            return 302 grafana/;
        }

        location /grafana/ {
            proxy_pass http://skytech_grafana__INGRESS_ENTRY__/grafana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-WEBAUTH-USER $grafana_user;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://skytech_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 3000;

        location = / {
            return 302 __INGRESS_ENTRY__/grafana/;
        }

        location __INGRESS_ENTRY__/grafana/ {
            proxy_pass http://skytech_grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Aus dem LAN nie per Header anmelden – nur mit Grafana-Login.
            proxy_set_header X-WEBAUTH-USER "";
            proxy_read_timeout 300s;
        }

        location / {
            return 404;
        }
    }
}
