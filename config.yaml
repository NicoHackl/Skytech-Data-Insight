name: "Skytech Data Insight"
version: "0.5.1"
slug: "skytech_data_insight"
description: >-
  Langzeitablage und Auswertung von Energiedaten für Home Assistant:
  TimescaleDB (PostgreSQL) für Leistungs-, Energie- und Soll/Ist-Werte,
  Grafana für Dashboards, Verwaltung über das integrierte Web-UI.
  Teil der Skytech-Produktfamilie.
url: "https://github.com/nicohackl/Skytech-Data-Insight"
arch:
  - amd64
init: false
startup: services
boot: auto
# Postgres braucht beim Stopp Zeit für einen sauberen Checkpoint; die
# Voreinstellung von 10 s reicht dafür bei größeren Datenmengen nicht.
timeout: 60
ingress: true
ingress_port: 8099
panel_icon: "mdi:chart-timeline-variant"
panel_title: "Data Insight"
homeassistant_api: true
# HA-Backup (D-023): vorher konsistenter Dump nach /data/backup, das
# Datenbankverzeichnis selbst bleibt draußen. Nach einer Wiederherstellung
# spielt das Add-on den Dump beim Start automatisch ein.
backup: hot
backup_pre: /usr/bin/skytech-backup-pre
backup_post: /usr/bin/skytech-backup-post
backup_exclude:
  - pgdata
  - pgdata/*
  - pgdata/**
  - "*.dump.tmp"
  # Lokale Sicherungen (MCP, manuell, Uploads) gehören nicht ins HA-Backup –
  # es hat seinen eigenen Dump; so bleibt es klein.
  - "backup/mcp_*"
  - "backup/manuell_*"
  - "backup/vor_aenderung_*"
  - "backup/upload_*"
  - "backup/vor_wiederherstellung_*"
  - "backup/ha_wiederhergestellt_*"
  - "backup/download_*"
hassio_api: true
# Die Seite „Zugänge“ schreibt Passwörter und MCP-Token in die eigenen
# Optionen; das erlaubt der Supervisor erst ab dieser Rolle (D-025).
hassio_role: manager
watchdog: "tcp://[HOST]:[PORT:8099]"
# LAN-Zugänge. Freigeben, umlegen oder abschalten über den Abschnitt
# „Netzwerk" der Add-on-Seite (D-009).
ports:
  3000/tcp: 3000
  5432/tcp: 5432
  8765/tcp: 8765
ports_description:
  3000/tcp: "Grafana im LAN (Anmeldung mit Grafana-Benutzer)"
  5432/tcp: "PostgreSQL im LAN, z. B. für VSCode (Anmeldung mit skytech_admin oder skytech_reader)"
  8765/tcp: "MCP-Server für LLMs wie Claude oder ChatGPT (Anmeldung mit mcp_token)"
options:
  log_level: info
  grafana_admin_password: ""
  db_password: ""
  db_readonly_password: ""
  mcp_token: ""
schema:
  log_level: list(debug|info|warning|error)
  grafana_admin_password: password?
  db_password: password?
  db_readonly_password: password?
  mcp_token: password?
