name: "Skytech Data Insight"
version: "0.2.0"
slug: "skytech_data_insight"
description: >-
  Langzeitablage und Auswertung von Energiedaten für Home Assistant:
  TimescaleDB (PostgreSQL) für Leistungs-, Energie- und Soll/Ist-Werte,
  Grafana für Dashboards, Verwaltung über das integrierte Web-UI.
  Teil der Skytech-Produktfamilie.
url: "https://github.com/nicohackl/Skytech-Data-Insight"
arch:
  - amd64
init: false
startup: services
boot: auto
# Postgres braucht beim Stopp Zeit für einen sauberen Checkpoint; die
# Voreinstellung von 10 s reicht dafür bei größeren Datenmengen nicht.
timeout: 60
ingress: true
ingress_port: 8099
panel_icon: "mdi:chart-timeline-variant"
panel_title: "Data Insight"
homeassistant_api: true
hassio_api: true
watchdog: "tcp://[HOST]:[PORT:8099]"
# LAN-Zugänge. Freigeben, umlegen oder abschalten über den Abschnitt
# „Netzwerk" der Add-on-Seite (D-009). MCP (8765) kommt mit M5 dazu.
ports:
  3000/tcp: 3000
  5432/tcp: 5432
ports_description:
  3000/tcp: "Grafana im LAN (Anmeldung mit Grafana-Benutzer)"
  5432/tcp: "PostgreSQL im LAN, z. B. für VSCode (Anmeldung mit skytech_admin oder skytech_reader)"
options:
  log_level: info
  grafana_admin_password: ""
  db_password: ""
  db_readonly_password: ""
schema:
  log_level: list(debug|info|warning|error)
  grafana_admin_password: password?
  db_password: password?
  db_readonly_password: password?
